name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys by pushing the built site to the gh-pages branch. GitHub enables
# Pages automatically when that branch appears, so no repository-settings
# permission is needed (the Actions-based Pages flow requires admin rights
# to create the Pages site, which the workflow token does not have).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Run Rust tests
        run: cargo test -p income-calc-core

      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web --release --out-dir ../../frontend/src/app/wasm/pkg --out-name income_calc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular app
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd frontend/dist/frontend/browser
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
