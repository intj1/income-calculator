name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Run Rust tests
        run: cargo test -p income-calc-core

      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web --release --out-dir ../../frontend/src/app/wasm/pkg --out-name income_calc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular app
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
